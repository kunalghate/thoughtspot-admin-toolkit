[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ts-admin-toolkit"
version = "0.1.0"
description = "A web-based admin control plane for ThoughtSpot administrators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["thoughtspot", "admin", "analytics"]

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # HTTP client for ThoughtSpot REST API
    "httpx>=0.27.0",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Database
    "sqlmodel>=0.0.19",
    "alembic>=1.13.0",

    # Config + credential storage
    "tomli>=2.0.0; python_version < '3.11'",  # tomllib is stdlib in 3.11+
    "keyring>=25.0.0",

    # CLI
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "httpx>=0.27.0",
    "respx>=0.20.0",
    "ruff>=0.15.0,<0.16.0",
    "mypy>=1.10.0",
]

[project.scripts]
ts-admin-toolkit = "ts_admin.cli:main"

[tool.hatch.build]
# ts_admin/static/ is gitignored (it is a build output, committed only at
# release time) and hatchling excludes VCS-ignored files by default. Without
# this, the published wheel ships the backend with no UI.
artifacts = ["ts_admin/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["ts_admin"]

[tool.hatch.build.targets.wheel.sources]
"ts_admin/static" = "ts_admin/static"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the repo root (rootdir) on sys.path so `from tests.unit.<mod> import ...`
# and `import ts_admin` resolve under ANY install mode — not only the editable
# install whose .pth happens to add the repo root. A bare `tests/conftest.py` is
# NOT sufficient: with no `tests/__init__.py`, prepend-mode inserts `tests/`
# itself, not the repo root (verified 2026-08-15 by renaming the .pth away).
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
