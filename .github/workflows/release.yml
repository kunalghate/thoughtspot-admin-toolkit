name: Release

# Publishes to PyPI when a version tag is pushed:
#
#   make build && git tag v0.1.0 && git push origin v0.1.0
#
# Authentication uses PyPI Trusted Publishing (OIDC) — no API token is stored as
# a repository secret. This requires a one-time setup on PyPI: add a trusted
# publisher for this repository, workflow `release.yml`, environment `pypi`.
# See https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The frontend is built here rather than committed, so a release can never
      # ship a stale UI that does not match the tagged backend.
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy static export into the package
        run: |
          rm -rf ts_admin/static/*
          cp -r frontend/out/. ts_admin/static/

      # ts_admin/static/ is gitignored, so it reaches the wheel only via the
      # `artifacts` entry in pyproject.toml. If that entry is removed, the build
      # still succeeds but ships no UI — fail loudly here instead.
      - name: Verify the UI is present before building
        run: |
          test -f ts_admin/static/index.html \
            || { echo "::error::ts_admin/static/index.html missing — frontend build did not produce an export"; exit 1; }

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Verify the UI is inside the built wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          if "ts_admin/static/index.html" not in names:
              sys.exit(f"::error::{wheel} contains no UI — check [tool.hatch.build] artifacts in pyproject.toml")
          print(f"{wheel}: {sum('ts_admin/static/' in n for n in names)} static files bundled")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Gives the job an OIDC identity for Trusted Publishing, and lets a human
    # add a required reviewer on the `pypi` environment if they want a manual
    # approval step before anything reaches PyPI.
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
