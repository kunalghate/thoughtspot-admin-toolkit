<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CS Tools — Feature Explorer</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
  :root { --accent: #38bdf8; --accent-dim: #0ea5e9; }
  html { scroll-behavior: smooth; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
  pre, code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* Mermaid containers */
  .mermaid { background: #0b1020; border: 1px solid #1e293b; border-radius: 12px; padding: 24px; overflow-x: auto; box-shadow: 0 4px 24px -8px rgba(0,0,0,0.5); transition: border-color 180ms ease; }
  .mermaid:hover { border-color: #334155; }
  .mermaid svg { max-width: 100%; height: auto; }

  /* Sidebar */
  .sidebar-item { transition: background 120ms ease, color 120ms ease, border-left-color 120ms ease; border-left: 3px solid transparent; }
  .sidebar-item.active { background: #1e293b; color: var(--accent); border-left-color: var(--accent); }
  .sidebar-item.hidden-by-search { display: none; }
  .sidebar-search { background: #0b1020; border: 1px solid #1e293b; border-radius: 8px; padding: 8px 12px; width: 100%; font-size: 13px; color: #e2e8f0; transition: border-color 150ms ease; }
  .sidebar-search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,0.15); }
  .sidebar-search::placeholder { color: #475569; }
  .kbd { display: inline-block; padding: 1px 5px; border: 1px solid #334155; border-bottom-width: 2px; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 10px; color: #94a3b8; background: #0b1020; }

  /* Tag pills */
  .tag { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
  .tag-read   { background: #0c4a6e; color: #7dd3fc; }
  .tag-write  { background: #713f12; color: #fbbf24; }
  .tag-delete { background: #7f1d1d; color: #fca5a5; }
  .tag-tui    { background: #4c1d95; color: #c4b5fd; }
  .tag-admin  { background: #064e3b; color: #6ee7b7; }

  /* Subtabs */
  .subtab { cursor: pointer; padding: 8px 16px; border-radius: 8px 8px 0 0; font-size: 13px; font-weight: 500; transition: all 150ms ease; }
  .subtab.active { background: #1e293b; color: var(--accent); border-bottom: 2px solid var(--accent); margin-bottom: -1px; }
  .subtab:not(.active):hover { background: #0f172a; color: #cbd5e1; }

  /* Step numbers */
  .step-num { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 9999px; background: var(--accent-dim); color: white; font-weight: 700; font-size: 12px; margin-right: 12px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(14,165,233,0.3); }

  /* API pills */
  .api-pill { display: inline-block; padding: 3px 8px; background: #0b1020; border: 1px solid #334155; border-radius: 5px; font-family: ui-monospace, monospace; font-size: 12px; color: #7dd3fc; transition: all 150ms ease; }
  .api-pill:hover { border-color: var(--accent); background: #0f172a; }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #020617; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }

  /* Sticky breadcrumb */
  .sticky-header { position: sticky; top: 0; z-index: 30; background: linear-gradient(to bottom, #020617 85%, rgba(2,6,23,0) 100%); backdrop-filter: blur(8px); padding: 12px 0 20px; margin: -32px -32px 0 -32px; padding-left: 32px; padding-right: 32px; }
  .sticky-header-inner { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #94a3b8; }
  .sticky-header-inner .crumb-home { cursor: pointer; transition: color 120ms ease; }
  .sticky-header-inner .crumb-home:hover { color: var(--accent); }

  /* Fade-in for content transitions */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .content-fade { animation: fadeIn 200ms ease-out; }

  /* Scroll-to-top button */
  #scroll-top { position: fixed; bottom: 24px; right: 24px; z-index: 40; width: 44px; height: 44px; border-radius: 9999px; background: #1e293b; color: var(--accent); border: 1px solid #334155; display: none; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.4); transition: all 150ms ease; }
  #scroll-top:hover { background: #334155; transform: translateY(-2px); }
  #scroll-top.visible { display: flex; }

  /* Home tiles */
  .home-tile { transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease; }
  .home-tile:hover { transform: translateY(-2px); border-color: var(--accent) !important; box-shadow: 0 8px 32px -12px rgba(56,189,248,0.25); }

  /* Home stat tiles */
  .stat-tile { position: relative; overflow: hidden; }
  .stat-tile::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(to right, transparent, var(--accent), transparent); opacity: 0.4; }

  /* Print styles */
  @media print {
    aside, #scroll-top { display: none !important; }
    body { background: white !important; color: black !important; }
    main { padding: 20px !important; }
    .mermaid { background: white !important; border: 1px solid #ddd !important; box-shadow: none !important; page-break-inside: avoid; }
    .bg-slate-900, .bg-slate-950 { background: #f8fafc !important; color: #0f172a !important; border-color: #e2e8f0 !important; }
    .text-white, .text-slate-100, .text-slate-200, .text-slate-300 { color: #0f172a !important; }
    .text-slate-400, .text-slate-500 { color: #475569 !important; }
    h1, h2 { page-break-after: avoid; }
  }
</style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

<div class="flex min-h-screen">
  <!-- SIDEBAR -->
  <aside class="w-72 bg-slate-900 border-r border-slate-800 flex flex-col sticky top-0 h-screen">
    <div class="p-5 border-b border-slate-800 cursor-pointer hover:bg-slate-800/50 transition" data-nav="home" title="Go to home (Esc)">
      <div class="text-xs uppercase tracking-widest text-slate-500 mb-1">ThoughtSpot</div>
      <div class="text-lg font-bold text-sky-400">CS Tools</div>
      <div class="text-xs text-slate-400 mt-1">Feature Explorer · click to go home</div>
    </div>
    <div class="px-4 pt-3 pb-2">
      <div class="relative">
        <input id="sidebar-search" class="sidebar-search pl-8" type="text" placeholder="Search features…" autocomplete="off" />
        <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </span>
        <span class="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none"><span class="kbd">/</span></span>
      </div>
    </div>
    <nav id="sidebar" class="flex-1 overflow-y-auto pb-3"></nav>
    <div class="p-4 border-t border-slate-800 text-xs text-slate-500 space-y-1">
      <div>12 features · 25+ commands</div>
      <div class="flex items-center gap-1"><span class="kbd">←</span><span class="kbd">→</span> navigate · <span class="kbd">Esc</span> home</div>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="main" class="flex-1 p-8 overflow-x-hidden max-w-[1400px]"></main>

  <!-- SCROLL TO TOP -->
  <button id="scroll-top" title="Scroll to top" aria-label="Scroll to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
  </button>
</div>

<script>
/* ============================================================
   FEATURE DATA
   ============================================================ */
const FEATURES = [

/* ========== 1. ARCHIVER ========== */
{
  id: 'archiver',
  name: 'Archiver',
  emoji: '🗑️',
  tags: ['read','write','delete'],
  purpose: 'Identify, tag, and remove stale (inactive or unmodified) user-generated Answers and Liveboards. Produces an auditable report.',
  plain: 'Marie Kondo for ThoughtSpot. Finds reports and dashboards that nobody has opened in 100+ days, labels them as inactive, and — after you approve — deletes them. Keeps the system from turning into a junk drawer of abandoned content.',
  whyItMatters: 'Clutter makes search results worse, slows down users, and wastes admin time. A typical customer has thousands of old Answers no one remembers creating.',
  commands: [
    { name: 'identify', desc: 'STEP 1 — Find stale dashboards and stick an "INACTIVE" label on them. Does NOT delete anything yet — it just labels, so admins can review the list first.' },
    { name: 'remove',   desc: 'STEP 2 (destructive) — Actually delete everything that has the INACTIVE label on it. Can export a TML backup first if you want a safety net.' },
    { name: 'untag',    desc: 'STEP 2 alternate (the "undo") — Delete the INACTIVE label itself. Deleting a label in ThoughtSpot automatically strips it off everything it was attached to, in ONE api call. The dashboards themselves are NOT deleted — only the label is gone. Use this when `identify` labeled things by mistake.' }
  ],
  flowchart: `graph TD
    A[Start: identify] --> B[1. GATHER_ACTIVITY<br/>query TS: BI Server weekly windows<br/>concurrency=4]
    B --> C[2. SWITCH to org]
    C --> D[3. GATHER_METADATA<br/>fetch_all ANSWER + LIVEBOARD<br/>resolve groups & ignore-tags]
    D --> E[4. FILTER_METADATA<br/>guid NOT in active_guids<br/>AND modified >= N days ago<br/>AND group filter passes]
    E --> F[5. DUMP_DATA<br/>syncer.dump archiver_report]
    F --> G[6. PREVIEW top 15 rows]
    G --> H{dry-run?}
    H -- yes --> Z[Exit]
    H -- no --> I[7. CONFIRM<br/>60s keypress listener]
    I --> J[8. ARCHIVE_TAGGING<br/>tags_create + tags_assign<br/>concurrency=15]
    J --> K[Done]
    style B fill:#075985,color:#fff
    style D fill:#075985,color:#fff
    style E fill:#713f12,color:#fff
    style F fill:#064e3b,color:#fff
    style I fill:#7f1d1d,color:#fff
    style J fill:#7f1d1d,color:#fff`,
  sequence: `sequenceDiagram
    participant U as User/CLI
    participant TS as ThoughtSpot REST
    participant S as Syncer (CSV/DB)
    U->>TS: workflows.search("TS: BI Server", query, weekly windows)
    TS-->>U: active answer_book_guids
    U->>TS: groups_search_v1() + group_list_users
    TS-->>U: group memberships
    U->>TS: metadata.fetch_all(["ANSWER","LIVEBOARD"])
    TS-->>U: all UGC metadata
    Note over U: filter stale = NOT active AND modified>=N
    U->>S: dump("archiver_report", stale_rows)
    U->>U: preview + confirm (60s)
    U->>TS: tags_create(name, color=purple)
    loop per stale object (concurrency=15)
        U->>TS: tags_assign(guid, tag)
    end`,
  steps: [
    { num: 1, text: 'Determine cluster timezone (UTC on cloud, cluster TZ on Falcon). Lifetime probe: min([Timestamp]) from TS: BI Server if --recent-activity is unset.' },
    { num: 2, text: 'Issue weekly windowed searches against the TS: BI Server worksheet, filtering out user_action=answer_unsaved and null answer_book_guid.', api: 'POST /api/rest/2.0/searchdata' },
    { num: 3, text: 'Switch org (optional).', api: 'ts.switch_org(org_id)' },
    { num: 4, text: 'If --only-groups / --ignore-groups: enumerate groups and their members.', api: 'GET /tspublic/v1/group + /tspublic/v1/group/{id}/users' },
    { num: 5, text: 'Fetch all matching Answers + Liveboards with pagination.', api: 'POST /api/rest/2.0/metadata/search' },
    { num: 6, text: 'Apply filter: guid NOT in active_guids AND (today - last_modified) >= --recent-modified days (default 100) AND author in/not-in chosen groups AND no ignored tag.' },
    { num: 7, text: 'Dump filtered rows to syncer as ArchiverReport(operation="IDENTIFY").', api: 'syncer.dump("archiver_report", data)' },
    { num: 8, text: 'Preview top 15 rows as a Rich table (TYPE / NAME / AUTHOR / MODIFIED days-ago).' },
    { num: 9, text: '60-second confirmation prompt with tick-tock countdown. N aborts.' },
    { num: 10, text: 'Create the tag.', api: 'POST /api/rest/2.0/tags/create (name, color=purple)' },
    { num: 11, text: 'Parallel tag-assign across all stale objects.', api: 'POST /api/rest/2.0/tags/assign (concurrency=15)' }
  ],
  edgeCases: [
    '`remove` flow: fetch_all tagged → optional parallel TML YAML export (concurrency=4) → metadata_delete in reverse (tag GUID last) at concurrency=15.',
    '`--only-groups` and `--ignore-groups` are mutually exclusive.',
    'Tag name lookup is case-sensitive.',
    'Ignores system-owned content through search-token filters.',
    'Requires the TS: BI Server embedded worksheet to be present.'
  ],
  webDecisions: {
    cli: 'Admin runs the CLI on their laptop; it calls ThoughtSpot REST, picks stale content, and tags/deletes it with a 60-second keyboard confirmation.',
    options: [
      { label: 'A', title: 'Interactive web flow', desc: 'Admin clicks "Find stale", sees a preview table, clicks "Archive". The most natural translation of the CLI — a preview + approve button instead of a keyboard prompt.' },
      { label: 'B', title: 'Scheduled with email approval', desc: '"Run identify every Monday, email me the list, only delete after I click Approve in the email." Set-and-forget for the admin, but still human-in-the-loop for safety.' },
      { label: 'C', title: 'Fully automated', desc: 'Identify + tag + delete on a cron with no human in the loop. Fast, but one bad config and you nuke real content.' }
    ],
    rec: 'Ship A first (interactive with preview). Add B (scheduled + email approval) as the enterprise upsell — that\'s the real "set it and forget it" value. Never ship C unless a customer signs a written waiver; the mistake surface is too large.'
  }
},

/* ========== 2. BULK-DELETER ========== */
{
  id: 'bulk-deleter',
  name: 'Bulk Deleter',
  emoji: '💣',
  tags: ['delete','read'],
  purpose: 'Mass-delete metadata by (a) dependency of a root GUID, (b) everything tagged, or (c) a list loaded from a Syncer.',
  plain: 'A mass-delete button with three ways to pick your victims: "delete everything that uses this thing", "delete everything with this label", or "delete this exact list I gave you". Can export a backup copy before it deletes.',
  whyItMatters: 'When a team leaves or a project wraps up, admins need to clean up dozens or hundreds of related objects. Deleting them one-by-one in the UI is unthinkable; this does it in one command with a safety preview.',
  commands: [
    { name: 'downstream',   desc: 'Point at ONE root object (like a worksheet) and delete everything that uses it — all the dashboards and Answers built on top of it. The root itself is NOT deleted. Good for "we\'re retiring this data source, kill everything that depends on it".' },
    { name: 'from-tag',     desc: 'Delete everything with a specific label. Can export a TML backup first. `--tag-only` skips the delete and just removes the label itself (safety undo, like archiver\'s untag).' },
    { name: 'from-tabular', desc: 'Delete an exact list of things. You provide a CSV/spreadsheet containing the GUIDs to kill; this deletes exactly those. Good for "here\'s the list from legal, delete these specific items".' }
  ],
  flowchart: `graph TD
    A[Start] --> B{Command?}
    B -- downstream --> C[metadata.dependents guid]
    B -- from-tag --> D[metadata.fetch_all tagged objects]
    B -- from-tabular --> E[syncer.load deletion]
    C --> F[Optional TML YAML export<br/>concurrency=4]
    D --> F
    E --> F
    F --> G[Preview top-15 table]
    G --> H{export-only?}
    H -- yes --> Z[Exit]
    H -- no --> I[Confirmation 60s]
    I --> J[RETRY DELETE LOOP<br/>while set not empty<br/>concurrency=15]
    J --> K{metadata_delete OK<br/>or 10 attempts?}
    K -- yes --> L[Discard GUID]
    K -- no --> J
    L --> M{set empty?}
    M -- no --> J
    M -- yes --> N[Done]
    style C fill:#075985,color:#fff
    style D fill:#075985,color:#fff
    style E fill:#075985,color:#fff
    style F fill:#064e3b,color:#fff
    style I fill:#7f1d1d,color:#fff
    style J fill:#7f1d1d,color:#fff`,
  sequence: `sequenceDiagram
    participant U as User/CLI
    participant TS as ThoughtSpot REST
    participant S as Syncer
    alt downstream
        U->>TS: metadata.dependents(guid)
        TS-->>U: dependent objects
    else from-tag
        U->>TS: metadata.fetch_one(tag, "TAG")
        U->>TS: metadata.fetch_all(types=[...], tag_identifiers=[tag_id])
        TS-->>U: tagged objects
    else from-tabular
        U->>S: syncer.load(deletion_directive)
        S-->>U: rows with guid column
    end
    U->>S: dump("deleter_report", ...)
    opt --directory
        par TML export
            U->>TS: metadata.tml_export(guid, YAML) × N (concurrency=4)
        end
    end
    U->>U: preview + confirm (60s)
    loop while guids_to_delete not empty
        par concurrency=15
            U->>TS: metadata_delete(guid)
            alt success OR attempts>10
                Note over U: discard guid from set
            else failure
                Note over U: retry (attempt++)
            end
        end
    end`,
  steps: [
    { num: 1, text: 'Resolve the target set depending on command: dependents, tagged, or tabular.', api: 'metadata.dependents / metadata.fetch_all / syncer.load' },
    { num: 2, text: 'Dump working set to syncer as DeleterReport.', api: 'syncer.dump("deleter_report", data)' },
    { num: 3, text: 'Optionally export TML (YAML) to --directory at concurrency=4.', api: 'POST /api/rest/2.0/metadata/tml/export' },
    { num: 4, text: 'Preview top-15 + confirm (60s).' },
    { num: 5, text: 'Delete loop: while pending set not empty, run bounded_gather at concurrency=15. Each GUID retries up to 10 attempts before being discarded.', api: 'POST /api/rest/2.0/metadata/delete' },
    { num: 6, text: 'from-tag with --tag-only skips object delete and only removes the tag.', api: 'POST /api/rest/2.0/tags/delete' }
  ],
  edgeCases: [
    'Retry is silent — no explicit backoff; relies on the 15-wide concurrency ceiling to pace.',
    '`downstream` does NOT delete the root GUID.',
    '`from-tag` (non-tag-only) does NOT delete the tag itself either.',
    '`--export-only` requires `--directory`.',
    'TML export concurrency is smaller (4) because payloads are larger than deletes.'
  ],
  webDecisions: {
    cli: 'Admin supplies GUIDs/tag/list on the command line, confirms once, CLI hard-deletes via REST with silent retries.',
    options: [
      { label: 'A', title: 'Preview + confirm web UI', desc: 'User pastes a list or picks a tag, sees exactly what will be deleted in a table, clicks one button. Much safer than the CLI because the preview is visual and clickable.' },
      { label: 'B', title: 'Soft-delete / Trash bin (recoverable)', desc: 'Instead of hard-deleting, move to a "Trash" tag for 30 days, then auto-hard-delete. Gives admins an undo window — huge trust builder.' },
      { label: 'C', title: 'API-driven', desc: 'Expose an endpoint other internal systems (HR, ticketing) can call to trigger deletes programmatically.' }
    ],
    rec: 'A + B together. The Trash window is your killer differentiator — every admin is terrified of mass-delete, and this removes the fear. Skip C until a partner explicitly asks for the API.'
  }
},

/* ========== 3. BULK SHARING ========== */
{
  id: 'bulk_sharing',
  name: 'Bulk Sharing',
  emoji: '🔐',
  tags: ['write','tui'],
  purpose: 'Column-level security (CLS) matrix editor via Textual TUI, plus a one-shot CLI to share all tagged objects to groups.',
  plain: 'A permissions spreadsheet. Rows are table columns (like "SSN" or "Salary"), columns are user groups (like "HR" or "Finance"), and each cell is a click-to-cycle setting: "no access", "can see", or "can edit". Also has a shortcut: "share everything tagged X with groups A and B".',
  whyItMatters: 'Setting permissions column-by-column in the native UI is a nightmare — especially for tables with 50+ columns. A matrix view is how admins actually think about it.',
  commands: [
    { name: 'cls-ui',   desc: 'Opens the permissions spreadsheet — rows are table columns, columns are user groups, cells are click-to-cycle access levels (none → read → edit). `--mode web` opens it in a browser; `--mode terminal` keeps it inside your terminal. For when you have 50 columns × 10 groups and clicking in the native UI is unbearable.' },
    { name: 'from-tag', desc: 'One-shot share: "every object with label X, share it with groups A and B at access level Y". No UI — one command, one call. Good for "all FINANCE-tagged dashboards, share with the Finance team at Read-Only".' }
  ],
  flowchart: `graph TD
    A[Start] --> B{Mode?}
    B -- cls-ui --> C[Textual App<br/>splash → home → security]
    C --> D[Home: debounced table search<br/>metadata_search LOGICAL_TABLE]
    D --> E[Home: group selection<br/>metadata_search USER_GROUP]
    E --> F[Security Matrix<br/>rows=columns cols=groups]
    F --> G[Pre-populate with<br/>metadata.permissions LOGICAL_COLUMN]
    G --> H[User clicks tri-state cells<br/>NO_ACCESS / READ_ONLY / MODIFY]
    H --> I[Submit: group by value<br/>one security_metadata_share per bucket]
    B -- from-tag --> J[metadata.fetch_one tag]
    J --> K[metadata.fetch_all tagged objects]
    K --> L[metadata.fetch_one each group GUID<br/>concurrency=15]
    L --> M[Confirm 60s]
    M --> N[ONE security_metadata_share call]
    style D fill:#075985,color:#fff
    style E fill:#075985,color:#fff
    style G fill:#075985,color:#fff
    style I fill:#064e3b,color:#fff
    style N fill:#064e3b,color:#fff`,
  sequence: `sequenceDiagram
    participant U as User (Browser or TTY)
    participant TUI as Textual App
    participant TS as ThoughtSpot REST
    U->>TUI: type partial table name
    TUI->>TS: metadata_search (LOGICAL_TABLE by name_pattern)
    TS-->>TUI: tables
    U->>TUI: pick table + select groups
    TUI->>TS: metadata.permissions for LOGICAL_COLUMN guids
    TS-->>TUI: current ACLs per column × group
    TUI->>U: render matrix (tri-state cells)
    U->>TUI: edit cells + submit
    TUI->>TS: security_metadata_share (one call per access-mode bucket)
    TS-->>TUI: OK
    TUI-->>U: confirmation`,
  steps: [
    { num: 1, text: '`cls-ui --mode web` spawns a textual_serve.server.Server wrapping tui.py — every session re-auths from CSToolsConfig so the browser inherits current creds.' },
    { num: 2, text: 'Home screen: DebouncedInput (0.5s delay) + RadioSet for tables; SelectionList for groups. Fed by metadata_search.', api: 'POST /api/rest/2.0/metadata/search (include_details=True, include_hidden_objects=True, record_size=-1)' },
    { num: 3, text: 'Security screen: rows = metadata_detail.columns, cols = chosen groups.' },
    { num: 4, text: 'Pre-populate cells by reading existing ACLs.', api: 'workflows.metadata.permissions(typed_guids={"LOGICAL_COLUMN": column_guids})' },
    { num: 5, text: 'On submit, cells are bucketed by chosen share_mode and ONE call per bucket is made in parallel.', api: 'POST /api/rest/2.0/security/metadata/share' },
    { num: 6, text: 'from-tag: single security_metadata_share call covering all tagged objects × all groups.', api: 'POST /api/rest/2.0/security/metadata/share' }
  ],
  edgeCases: [
    'Groups marked metadata_detail.visibility == "NON_SHARABLE" are dimmed but selectable.',
    'Table icons are letters W/M/V/S/U/T driven by metadata_header.type.',
    'Modes available: NO_ACCESS, READ_ONLY, MODIFY.'
  ],

  tags: ['read','write','admin'],
  purpose: 'Git-like TML workflow: export TML from one environment, then import into another with automatic GUID remapping, delta imports, validate-only dry-runs, and checkpoint history.',
  plain: 'Dev-to-Prod migration tool. Export all your dashboards and worksheets from the Dev environment as files, then import them into Prod — and it automatically rewires all the IDs so things don\'t break. Keeps a history file so it knows what was already moved and only touches what changed.',
  whyItMatters: 'Moving content between environments is the #1 reason customers ask for help. Doing it manually means mapping IDs by hand in YAML files — tedious and error-prone. This turns it into two commands.',
  commands: [
    { name: 'checkpoint', desc: 'Export ALL your TML (dashboards, worksheets, etc.) from one environment to a folder of text files. Also writes a "mapping file" that tracks which IDs exist in which environment and remembers what got exported when. Think `git pull` for ThoughtSpot. Aliases: `export`, `commit`.' },
    { name: 'deploy',     desc: 'Import TML from a folder into another environment. The magic part: it automatically rewrites all the IDs so things don\'t break (a worksheet\'s ID in Dev is different from its ID in Prod — this fixes that). Three safety levels: `VALIDATE_ONLY` (dry-run), `ALL_OR_NONE` (atomic), `PARTIAL` (best-effort). DELTA mode only deploys files changed since last deploy. Alias: `import`.' }
  ],
  flowchart: `graph TD
    A[checkpoint start] --> B[Load/create<br/>.mappings/&lt;env&gt;-guid-mappings.json]
    B --> C[metadata.fetch_all<br/>types, pattern, authors, tags]
    C --> D[Normalize via<br/>api_transformer.ts_metadata_object]
    D --> E[Filter system users unless include-system]
    E --> F{delete-aware?}
    F -- yes --> G[Prune missing GUIDs<br/>from mapping + disk]
    F -- no --> H[Parallel TML export<br/>concurrency=4<br/>YAML files per object]
    G --> H
    H --> I[Append MappingCheckpoint<br/>mode=EXPORT to history]
    I --> J[Save mapping JSON]

    K[deploy start] --> L[GUIDMappingInfo.merge src→tgt]
    L --> M{DELTA?}
    M -- yes --> N[Skip files where<br/>mtime &lt; last_import_dt]
    M -- no --> O[All files]
    N --> P[TML.load path]
    O --> P
    P --> Q[disambiguate<br/>rewrite every GUID<br/>respects env.VAR interpolation]
    Q --> R[metadata.tml_import<br/>policy=ALL_OR_NONE / PARTIAL / VALIDATE_ONLY]
    R --> S[map_guid src→tgt<br/>record new GUIDs]
    S --> T{--tags?}
    T -- yes --> U[metadata.tag_all<br/>color #A020F0]
    T -- no --> V[Done]
    U --> V
    style H fill:#075985,color:#fff
    style R fill:#064e3b,color:#fff
    style Q fill:#713f12,color:#fff`,
  sequence: `sequenceDiagram
    participant U as User/CLI
    participant TS as ThoughtSpot REST
    participant FS as .mappings JSON file
    rect rgb(20,30,50)
      Note over U,TS: checkpoint
      U->>FS: load env-guid-mappings.json
      U->>TS: metadata.fetch_all(types, pattern, authors, tags)
      TS-->>U: objects
      par concurrency=4
        U->>TS: metadata.tml_export(guid, YAML)
        TS-->>U: TML YAML
      end
      U->>FS: write .tml files + append EXPORT checkpoint
    end
    rect rgb(30,50,20)
      Note over U,TS: deploy
      U->>FS: merge src mapping into tgt
      U->>U: TML.load + disambiguate (rewrite GUIDs)
      U->>TS: metadata.tml_import(tmls, policy)
      TS-->>U: imported objects with new GUIDs
      U->>FS: map_guid old to new, append IMPORT checkpoint
      opt --tags
        U->>TS: metadata.tag_all(new_guids, tags, color=purple)
      end
    end`,
  steps: [
    { num: 1, text: 'checkpoint: load or create .mappings/<env>-guid-mappings.json with {metadata, mapping (src→tgt), additional_mapping, history[]}.' },
    { num: 2, text: 'Fetch matching metadata with pagination.', api: 'POST /api/rest/2.0/metadata/search' },
    { num: 3, text: 'Per-object TML export at concurrency=4 (more stresses Atlas). Writes <name>.<guid>.tml YAML files.', api: 'POST /api/rest/2.0/metadata/tml/export (edoc_format=YAML)' },
    { num: 4, text: '--delete-aware removes GUIDs from mapping + deletes .tml files absent from this export.' },
    { num: 5, text: 'Append MappingCheckpoint(mode="EXPORT", status, {files_expected, files_exported}) to history.' },
    { num: 6, text: 'deploy: GUIDMappingInfo.merge(src, tgt) combines mappings; detects env mismatch.' },
    { num: 7, text: 'DELTA mode: skip files where mtime < last_import_dt from history.' },
    { num: 8, text: 'For each TML: determine_tml_type → TML.load → disambiguate (rewrites every GUID using .mapping + .additional_mapping; unmapped source GUIDs nulled). Respects ${{ env.VAR }} interpolation.' },
    { num: 9, text: 'Import as batch.', api: 'POST /api/rest/2.0/metadata/tml/import (policy, use_async_endpoint on 10.5+)' },
    { num: 10, text: 'Record new target GUIDs back into mapping via map_guid(old, new, disallow_overriding=True).' },
    { num: 11, text: 'Optional: tag newly-imported content.', api: 'workflows.metadata.tag_all(guids, tags, color=purple)' }
  ],
  edgeCases: [
    'Exit codes: 0 OK, 1 ERROR, 2 WARNING.',
    'VALIDATE_ONLY policy is a server-side dry-run — nothing is imported.',
    'Concurrency hard-capped at 4 for TML export due to server pressure.',
    'History capped at 300 checkpoints (rolling).',
    'GUID disambiguation also handles Connection GUIDs and FQNs embedded in TML.'
  ],
  webDecisions: {
    cli: 'Admin exports TML files from Dev to a local folder, then runs deploy to push them to Prod — the CLI auto-rewrites IDs using a mapping JSON file on disk.',
    options: [
      { label: 'A', title: 'Web migration wizard', desc: 'Pick source env, pick target env, preview the ID mapping diff, click Deploy. Store the mapping file in YOUR database, not on the user\'s laptop. Much safer and more discoverable than the CLI.' },
      { label: 'B', title: 'Git-first (deprecate this)', desc: 'Tell customers to use the Git integration instead; build this feature minimally. Simpler for you, but leaves non-Git users behind.' },
      { label: 'C', title: 'Both — Git for Git users, scriptability for others', desc: 'Offer both paths. Customers on GitHub use Git; customers without use the wizard.' }
    ],
    rec: 'A — the migration wizard is a top-3 admin pain point and the ID-remapping logic is where the real value lives (not the file transport). Build A well; add C later if your customer base splits.'
  }
},

/* ========== 10. SEARCHABLE (FLAGSHIP) ========== */
{
  id: 'searchable',
  name: 'Searchable ⭐',
  emoji: '🔍',
  tags: ['read','write','admin'],
  purpose: 'Extract ThoughtSpot\'s OWN metadata (users, groups, content, columns, sharing, usage, audit, TML, AI stats) into an external database so you can "query ThoughtSpot with ThoughtSpot".',
  plain: 'Makes ThoughtSpot report on itself. Copies everything about your ThoughtSpot environment — who the users are, what content exists, who opened what, which queries were slow, who got what permissions — into a database you own. Then you can build dashboards in ThoughtSpot that answer questions like "which reports have never been opened?" or "who accessed payroll data last month?".',
  whyItMatters: 'This is the flagship tool. Admins need to answer governance questions daily (who, what, when, why) but ThoughtSpot doesn\'t expose that data natively. This tool is the only way most customers get observability into their platform.',
  commands: [
    { name: 'deploy',      desc: 'Install the pre-built governance dashboards into ThoughtSpot. Tell it which warehouse will receive the extracted data (Snowflake? Databricks? Falcon?) and it rewires the dashboard\'s Table definitions to point there. Run once per cluster.' },
    { name: 'metadata',    desc: 'The main snapshot. Walks through every org, every user, every group, every dashboard, every column, every permission — and copies it all to your warehouse. This is what powers 95% of governance dashboards. Run nightly. Uses a local SQLite scratch file as a staging buffer for speed.' },
    { name: 'bi_server',   desc: 'Copy the usage log — who opened what, when, how long it took, what browser. Every page view is a row. Run this hourly if you want near-real-time "is anyone using this dashboard?" answers.' },
    { name: 'audit_logs',  desc: 'Copy the security trail — logins, admin actions, permission changes. ThoughtSpot only retains 30 days natively, so if you need longer retention for SOC2/HIPAA compliance, schedule this daily. `--last-k-days` capped at 30.' },
    { name: 'tml',         desc: 'Back up every dashboard/worksheet as a text file (TML). `SNAPSHOT` grabs everything every time; `DELTA` only grabs what changed since last run (so you can schedule it hourly without exploding storage). Useful for history, diffs, and disaster recovery.' },
    { name: 'ts_ai_stats', desc: 'Copy the query-performance log — latencies, errors, SQL that actually ran, credits consumed. Answers "why is my dashboard slow?" and "who is burning all our query credits?". Doesn\'t work on on-prem Falcon (the source worksheet assumes a warehouse).' }
  ],
  subCommands: [
    {
      id: 'deploy',
      name: 'deploy',
      purpose: 'Install the bundled Searchable SpotApp (Liveboards + Worksheets + Tables) into the cluster. Rewrites Table TML to point at whichever external DB will receive data from metadata / bi_server / etc.',
      plain: 'Installs the pre-built governance dashboards into your ThoughtSpot. Think "install the IKEA kit" — everything is pre-assembled; you just tell it which warehouse your extracted data will land in, and it rewires itself to point there.',
      flowchart: `graph TD
        A[Start] --> B[metadata_search guid=cnxn_guid<br/>lookup dialect + connection name]
        B --> C[_ensure_external_mapping tml, connection_info<br/>rewrite tml.table.db/schema/db_table<br/>columns[].db_column_name]
        C --> D{Dialect}
        D -- SNOWFLAKE --> E[UPPER case names]
        D -- FALCON --> F[Null connection.name/fqn<br/>inject cluster_id in final formula]
        D -- other --> G[casefold names]
        E --> H[Skip TS_BI_SERVER.table.tml<br/>unless Falcon]
        F --> H
        G --> H
        H --> I[metadata.tml_import<br/>policy=ALL_OR_NONE timeout=900s]
        style I fill:#064e3b,color:#fff`,
      sequence: `sequenceDiagram
        participant U as User/CLI
        participant TS as TS REST
        U->>TS: metadata_search(guid=cnxn_guid)
        TS-->>U: dialect + connection_name
        U->>U: rewrite TMLs: db, schema, db_table, db_column_name<br/>(case per dialect)
        U->>TS: metadata.tml_import(tmls, policy="ALL_OR_NONE", timeout=900)
        TS-->>U: import results`,
      steps: [
        { num: 1, text: 'Required: --connection-guid (or literal "falcon") + --database + --schema.' },
        { num: 2, text: 'Look up connection dialect + name.', api: 'POST /api/rest/2.0/metadata/search' },
        { num: 3, text: 'Rewrite each Table TML: db, schema, db_table, and per-column db_column_name. Case rules: Snowflake UPPER, Falcon null connection, everything else casefold.' },
        { num: 4, text: 'Non-Falcon clusters SKIP TS_BI_SERVER.table.tml (uses a SAGE view instead). Falcon clusters inject cluster_id into the view\'s final formula.' },
        { num: 5, text: 'Batch import.', api: 'POST /api/rest/2.0/metadata/tml/import (policy=ALL_OR_NONE, 15 min timeout)' },
        { num: 6, text: '--export downloads the customized TML instead of importing.' }
      ]
    },
    {
      id: 'metadata',
      name: 'metadata',
      purpose: 'Populate 15 tables with TS metadata. Stages everything to a local SQLite (fast upserts) then streams to your final syncer.',
      plain: 'The main extract. Walks through every org, every user, every group, every dashboard/worksheet/table, every column, every permission — and copies all of it to your warehouse. This is the "inventory scan" that makes all the governance dashboards possible.',
      flowchart: `graph TD
        A[Start] --> B[Create temp SQLite<br/>ts.config.temp_dir/temp.db<br/>WAL + speedy pragmas]
        B --> C{for each org}
        C --> D[TS_ORG: orgs_search]
        D --> E[TS_GROUP: groups_search_v1]
        E --> F[TS_PRIVILEGE]
        F --> G[TS_USER: users_search<br/>paginator record_size=5000]
        G --> H[TS_TAG: tags_search]
        H --> I[TS_METADATA: metadata.fetch_all<br/>CONNECTION/TABLE/LIVEBOARD/ANSWER]
        I --> J[TS_COLUMN: metadata.fetch<br/>typed_guids LOGICAL_TABLE<br/>include_details=True]
        J --> K[TS_DEPENDENT: metadata.fetch<br/>typed_guids LOGICAL_COLUMN<br/>include_dependent_objects]
        K --> L[TS_ACCESS: metadata.permissions]
        L --> C
        C -- done --> M[DUMP_DATA: stream from temp<br/>batch=1M to final syncer]
        M --> N{TRUNCATE?}
        N -- yes --> O[1st batch TRUNCATE<br/>rest APPEND]
        N -- no --> P[All APPEND]
        style B fill:#713f12,color:#fff
        style M fill:#064e3b,color:#fff`,
      sequence: `sequenceDiagram
        participant U as User/CLI
        participant TS as TS REST
        participant T as temp SQLite
        participant S as Final Syncer
        U->>T: create temp.db (WAL, speedy pragmas)
        loop per org
          U->>TS: orgs_search, groups_search_v1, users_search, tags_search
          TS-->>U: principals & tags
          U->>T: dump ts_org, ts_group, ts_user, ts_tag, ts_xref_*
          U->>TS: metadata.fetch_all(["CONNECTION","LOGICAL_TABLE","LIVEBOARD","ANSWER"])
          TS-->>U: objects
          U->>T: dump ts_data_source, ts_metadata_object, ts_tagged_object
          U->>TS: metadata.fetch(LOGICAL_TABLE, include_details=True)
          TS-->>U: columns + synonyms
          U->>T: dump ts_metadata_column, ts_column_synonym
          U->>TS: metadata.fetch(LOGICAL_COLUMN, include_dependent_objects)
          TS-->>U: dependencies
          U->>T: dump ts_dependent_object
          U->>TS: metadata.permissions(typed_guids)
          TS-->>U: ACLs
          U->>T: dump ts_sharing_access
        end
        loop read_stream(batch=1M)
          T-->>U: rows
          U->>S: dump(table, rows)
        end`,
      steps: [
        { num: 1, text: 'Stage to temp SQLite at ts.config.temp_dir/temp.db with load_strategy=UPSERT, pragma_speedy_inserts=True (WAL, synchronous=OFF, 512MB cache).' },
        { num: 2, text: 'TS_ORG: orgs_search → ts_org.' },
        { num: 3, text: 'TS_GROUP: groups_search_v1 → ts_group + ts_xref_principal.', api: 'GET /tspublic/v1/group (v1 endpoint, not v2!)' },
        { num: 4, text: 'TS_PRIVILEGE: → ts_group_privilege.' },
        { num: 5, text: 'TS_USER (org 0 or --org override): paginator over users_search, record_size=5000, timeout=900.', api: 'POST /api/rest/2.0/users/search' },
        { num: 6, text: 'TS_TAG: tags_search → ts_tag.', api: 'POST /api/rest/2.0/tags/search' },
        { num: 7, text: 'TS_METADATA: fetch_all(["CONNECTION","LOGICAL_TABLE","LIVEBOARD","ANSWER"]) filtered to current org → ts_data_source, ts_metadata_object, ts_tagged_object.', api: 'POST /api/rest/2.0/metadata/search' },
        { num: 8, text: 'TS_COLUMN: fetch columns with include_details + include_hidden_objects → upsert ts_metadata_object with data_source_guid, fill ts_metadata_column + ts_column_synonym.', api: 'POST /api/rest/2.0/metadata/fetch' },
        { num: 9, text: 'TS_DEPENDENT: reverse dep graph via include_dependent_objects=True, dependent_objects_record_size=-1 → ts_dependent_object.' },
        { num: 10, text: 'TS_ACCESS: permissions per typed_guids (supports compat_ts_version) → ts_sharing_access (OBJECT_LEVEL_SECURITY + optional COLUMN_LEVEL_SECURITY).', api: 'POST /api/rest/2.0/security/metadata/permissions' },
        { num: 11, text: 'DUMP_DATA: read_stream(tablename, batch=1_000_000) from temp, dump to final syncer. TRUNCATE strategy flips first batch to TRUNCATE and rest to APPEND.' }
      ]
    },
    {
      id: 'bi_server',
      name: 'bi_server',
      purpose: 'Extract usage events by running a search against the TS: BI Server system worksheet.',
      plain: 'Copies the "who opened what, when" log. Every page view, every search, every dashboard load becomes a row in your warehouse. This is how you answer "which content is actually getting used?".',
      flowchart: `graph TD

    {

      name: 'audit_logs',

      flowchart: `graph TD

        style D fill:#075985,color:#fff

        participant U as User/CLI

    {
      id: 'tml',
      name: 'tml',
      purpose: 'Snapshot all TML into a syncer for history/diffing/backup.',
      plain: 'Backs up every dashboard and worksheet as a text file ("TML"). If something breaks or gets deleted, you have a history. "DELTA" mode only backs up what changed since last time, so you can run it hourly without exploding storage.',

function filterSidebar(query) {
  const q = (query || '').trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll('.sidebar-item').forEach(it => {
    const match = !q || (it.dataset.search || '').includes(q);
    it.classList.toggle('hidden-by-search', !match);
    if (match) visible++;
  });
  const empty = document.getElementById('sidebar-empty');
  if (empty) empty.remove();
  if (visible === 0) {
    const msg = document.createElement('div');
    msg.id = 'sidebar-empty';
    msg.className = 'px-5 py-4 text-xs text-slate-500 italic';
    msg.textContent = `No features match "${query}"`;
    document.getElementById('sidebar').appendChild(msg);
  }
}

        <div class="stat-tile bg-slate-900 border border-slate-800 rounded-xl p-6">
          <div class="text-4xl font-bold text-amber-400">14</div>
          <div class="text-slate-400 text-sm mt-1.5 font-medium">Syncer backends</div>
          <div class="text-slate-500 text-xs mt-0.5">CSV to Databricks</div>
        </div>
      </div>

      <div class="flex items-center justify-between mb-4">
        <div class="text-xs uppercase tracking-widest text-slate-500 font-semibold">Feature overview</div>
        <div class="text-xs text-slate-500">Click any card to explore</div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        ${FEATURES.map(f => `
          <div class="home-tile bg-slate-900 border border-slate-800 rounded-xl p-5 cursor-pointer" data-id="${f.id}">
            <div class="flex items-center gap-3 mb-2.5">
              <span class="text-2xl">${f.emoji}</span>
              <span class="font-semibold text-white">${f.name}</span>
              <span class="ml-auto text-[10px] text-slate-500 font-mono">${f.commands.length + (f.subCommands?.length||0)} cmds</span>
            </div>
            <div class="text-sm text-slate-300 leading-relaxed">${f.plain || f.purpose}</div>
            <div class="flex gap-1.5 mt-4 flex-wrap">${f.tags.map(tagChip).join('')}</div>
          </div>
        `).join('')}
      </div>

      <div class="mt-10 p-5 bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800 rounded-xl">
        <div class="flex items-start gap-3">
          <span class="text-2xl">💡</span>
          <div class="text-sm text-slate-300 leading-relaxed">
            <span class="text-slate-100 font-semibold">How to use this:</span>
            Click any feature in the sidebar or tile above. Each page has a plain-English explanation, a visual flow diagram, a step-by-step API walkthrough, and a "Web version architecture decisions" section you can share with your manager.
            <div class="mt-3 text-xs text-slate-500">
              Keyboard: <span class="kbd">/</span> search · <span class="kbd">←</span><span class="kbd">→</span> navigate · <span class="kbd">Esc</span> home
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function selectFeature(id, subId) {
  const f = FEATURES.find(x => x.id === id);
  if (!f) return;
  document.querySelectorAll('.sidebar-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  if (f.subCommands && !subId) subId = f.subCommands[0].id;
  renderFeature(f, subId);
  history.replaceState(null, '', `#${id}${subId?'/'+subId:''}`);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goHome() {
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  history.replaceState(null, '', location.pathname);
  renderHome();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function navigateOffset(delta) {
  const active = document.querySelector('.sidebar-item.active');
  if (!active) {
    if (delta > 0) selectFeature(FEATURES[0].id);
    return;
  }
  const idx = FEATURES.findIndex(f => f.id === active.dataset.id);
  const next = idx + delta;
  if (next >= 0 && next < FEATURES.length) {
    selectFeature(FEATURES[next].id);
  }
}

function bootstrap() {
  // Delegated click listener — survives every innerHTML replace
  document.body.addEventListener('click', (ev) => {
    const homeNav = ev.target.closest('[data-nav="home"]');
    if (homeNav) { goHome(); return; }

    const subTab = ev.target.closest('.subtab');
    if (subTab && subTab.dataset.subid) {
      const currentFeatureId = document.querySelector('.sidebar-item.active')?.dataset.id;
      if (currentFeatureId) selectFeature(currentFeatureId, subTab.dataset.subid);
      return;
    }

    const clickable = ev.target.closest('[data-id]');
    if (clickable && clickable.dataset.id) {
      selectFeature(clickable.dataset.id);
    }
  });

  // Sidebar search
  const search = document.getElementById('sidebar-search');
  search.addEventListener('input', (e) => filterSidebar(e.target.value));
  search.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { search.value = ''; filterSidebar(''); search.blur(); }
    if (e.key === 'Enter') {
      const firstVisible = document.querySelector('.sidebar-item:not(.hidden-by-search)');
      if (firstVisible) { selectFeature(firstVisible.dataset.id); search.blur(); }
    }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    const inInput = ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
    if (e.key === '/' && !inInput) { e.preventDefault(); search.focus(); search.select(); return; }
    if (inInput) return;
    if (e.key === 'Escape') { goHome(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); navigateOffset(1); }
    if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft')  { e.preventDefault(); navigateOffset(-1); }
  });

  // Scroll-to-top button visibility
  const scrollBtn = document.getElementById('scroll-top');
  scrollBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  window.addEventListener('scroll', () => {
    scrollBtn.classList.toggle('visible', window.scrollY > 400);
  });

  renderSidebar();
  const hash = location.hash.replace(/^#/,'');
  if (hash) {
    const [id, subId] = hash.split('/');
    if (FEATURES.some(f => f.id === id)) {
      selectFeature(id, subId);
      return;
    }
  }
  renderHome();
}

bootstrap();
</script>
</body>
</html>
